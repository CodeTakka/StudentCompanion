<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Statistics</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="images/logo.png" />
    <link rel="stylesheet" href="css/admin-styles.css" />
    <!-- Chart.js to generate charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="header-left">
        <img src="images/logo.png" width="50" />
        <div class="header-text">
          <h1>Smart Course Companion</h1>
          <span>Admin Panel</span>
        </div>
      </div>
      <nav class="admin-nav">
        <a href="manage-course.html">Manage Courses</a>
        <a href="grades-admin.html">Manage Grades</a>
        <a href="assessments-admin.html">Manage Assessments</a>
        <a href="view-statistics.html" class="active">View Statistics</a>
      </nav>
      <div class="header-right">
        <a href="home-page.html" class="logout-btn" onclick="clearSession()">Logout</a>
      </div>
    </header>

    <h2>Statistics</h2>

    <section class="summary-section">
      <div class="summary-card">
        <h4>Total Courses</h4>
        <p id="statCourses">—</p>
      </div>
      <div class="summary-card">
        <h4>Total Assessments</h4>
        <p id="statAssessments">—</p>
      </div>
      <div class="summary-card">
        <h4>Completed Assessments</h4>
        <p id="statCompleted">—</p>
      </div>
      <div class="summary-card">
        <h4>Overall Average</h4>
        <p id="statOverallAverage">—</p>
      </div>
    </section>

    <section class="course-averages">
      <h3>Course Averages</h3>
      <div id="courseAveragesContainer">
        <!-- Dynamic course averages will be inserted here -->
      </div>
    </section>

  <section class="charts-section">
      <div class="chart-card">
        <h3>Assessment Completion</h3>
        <canvas id="completionChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>Average Grade per Course</h3>
        <canvas id="avgPerCourseChart"></canvas>
      </div>
    </section>

    <script src="js/api.js"></script>
    <script>requireAdmin();</script>
    <script src="js/view-statistics.js"></script>
  </body>
</html>
