<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Add Assessment</title>
    <link rel="icon" type="image/png" href="images/logo.png" />
    <link rel="stylesheet" href="css/add-assessment-styles.css" />
  </head>
  <body>
    <div class="page">
      <h2>Add Assessment</h2>

      <div class="panel">
        <div class="form-group">
          <label>Name</label>
          <input type="text" placeholder="Example : Quiz 3" />
        </div>

        <div class="form-group">
          <label>Type</label>
          <input type="text" placeholder="Example : Quiz, Exam, Lab..." />
        </div>

        <div class="form-group">
          <label>Due Date</label>
          <input type="date" />
        </div>

        <div class="form-group">
          <label>Weight (%)</label>
          <input type="number" placeholder="Example : 15" />
        </div>

        <div class="btn-row">
          <a class="btn" href="assessments-admin.html">Cancel</a>
          <a class="btn primary" href="assessments-admin.html">Add</a>
        </div>
      </div>
    </div>
  </body>
</html>
