<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Manage Assessments</title>
    <link rel="icon" type="image/png" href="images/logo.png" />
    <link rel="stylesheet" href="css/assessments-admin-styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="header-left">
        <img src="images/logo.png" width="50" />
        <div class="header-text">
          <h1>Smart Course Companion</h1>
          <span>Admin Panel</span>
        </div>
      </div>
      <nav class="admin-nav">
        <a href="manage-course.html">Manage Courses</a>
        <a href="grades-admin.html">Manage Grades</a>
        <a href="assessments-admin.html" class="active">Manage Assessments</a>
        <a href="view-statistics.html">View Statistics</a>
      </nav>
      <div class="header-right">
        <a href="home-page.html" class="logout-btn" onclick="clearSession()">Logout</a>
      </div>
    </header>

    <div class="page">
      <h2>Manage Assessments</h2>

      <!-- Course selector -->
      <div class="panel" style="margin-bottom:16px">
        <label><strong>Select Course:</strong>
          <select id="courseSelect" style="margin-left:10px;padding:6px">
            <option value="">— choose a course —</option>
          </select>
        </label>
      </div>

      <div class="panel" id="assessmentPanel" style="display:none">
        <div class="table-actions">
          <button class="btn primary" onclick="showAddForm()">+ Add Assessment</button>
        </div>

        <table class="assess-table">
          <thead>
            <tr>
              <th>Assessment</th>
              <th>Type</th>
              <th>Due Date</th>
              <th>Total Marks</th>
              <th>Weight</th>
              <th>Visible</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="assessmentTableBody">
            <tr><td colspan="7" style="text-align:center;color:#888">Select a course above.</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Inline add/edit form -->
      <div class="panel" id="assessmentForm" style="display:none">
        <h3 id="formTitle">Add Assessment</h3>
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="aName" placeholder="e.g. Quiz 3" />
        </div>
        <div class="form-group">
          <label>Type</label>
          <select id="aType">
            <option value="Quiz">Quiz</option>
            <option value="Exam">Exam</option>
            <option value="Assignment">Assignment</option>
            <option value="Project">Project</option>
            <option value="Lab">Lab</option>
          </select>
        </div>
        <div class="form-group">
          <label>Due Date</label>
          <input type="date" id="aDueDate" />
        </div>
        <div class="form-group">
          <label>Weight (%)</label>
          <input type="number" id="aWeight" placeholder="e.g. 15" min="0" max="100" />
        </div>
        <div class="form-group">
          <label>Total Marks</label>
          <input type="number" id="aTotalMarks" placeholder="e.g. 100" min="1" />
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="aVisible" checked /> Visible to students</label>
        </div>
        <div class="btn-row">
          <button class="btn" onclick="hideForm()">Cancel</button>
          <button class="btn primary" id="formSubmitBtn" onclick="submitAssessmentForm()">Add</button>
        </div>
        <p id="formMessage" style="color:#c0392b;margin-top:8px"></p>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script>requireAdmin();</script>
    <script src="js/assessments-admin.js"></script>
  </body>
</html>
