<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Assessments</title>
    <link rel="icon" type="image/png" href="images/logo.png" />
    <link rel="stylesheet" href="css/general-student.css" />
    <link rel="stylesheet" href="css/student-assessment.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="images/logo.png" width="50" />
        <div>
          <h1>Student Dashboard</h1>
          <p class="muted">Courses • Progress • Calendar</p>
        </div>
      </div>
      <nav class="student-nav">
        <a class="dashboard" href="dashboard.html">Dashboard</a>
        <a href="#" id="logoutBtn">Logout</a>
      </nav>
    </header>

    <div class="page">
      <h2 id="pageTitle">Assessments</h2>

      <div class="panel">
        <table class="assess-table">
          <thead>
            <tr>
              <th>Assessment</th>
              <th>Type</th>
              <th>Due Date</th>
              <th>Grade</th>
              <th>Weight</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="assessmentTableBody">
            <tr><td colspan="7" style="text-align:center;color:#888">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script>requireAuth();</script>
    <script src="js/navigation.js"></script>
    <script src="js/student-assessment.js"></script>
  </body>
</html>
