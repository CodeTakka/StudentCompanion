<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Assessments</title>
    <link rel="icon" type="image/png" href="images/logo.png" />
    <link rel="stylesheet" href="css/general-student.css" />
    <link rel="stylesheet" href="css/student-assessment.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="images/logo.png" width="50" />
        <div>
          <h1>My Assessments</h1>
          <p class="muted">View Asssessments • Submit Assessments</p>
        </div>
      </div>
      <nav class="student-nav">
        <a class="dashboard" href="dashboard.html">Dashboard</a>
        <a class="dashboard" href="grades.html">Grades</a>
        <a class="dashboard active" href="student-assessment.html">Assessments</a>
        <a href="#" id="logoutBtn">Logout</a>
      </nav>
    </header>

    <div class="page">
      <h2 id="pageTitle">Assessments</h2>

      <div class="panel" style="margin-bottom: 12px;">
        <label for="courseFilter" style="font-weight:600;margin-right:12px">Filter by course:</label>
        <select id="courseFilter" style="padding:6px;min-width:220px">
          <option value="all">All courses</option>
        </select>
      </div>

      <div class="panel">
        <table class="assess-table">
          <thead>
            <tr>
              <th>Assessment</th>
              <th>Type</th>
              <th>Due Date</th>
              <th>Grade</th>
              <th>Weight</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="assessmentTableBody">
            <tr>
              <td colspan="7" style="text-align: center; color: #888">
                Loading…
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div id="submissionModal" class="modal hidden">
      <div class="modal-content">
        <span class="close-modal" onclick="closeSubmissionModal()">&times;</span>
        <h2>Submit Assessment</h2>
        <div id="assessmentDetails">
        </div>
        <div class="submission-status" id="submissionStatus"></div>
        <form id="submitForm" style="display: none;">
          <div class="form-group">
            <label for="fileInput">Choose file to submit:</label>
            <input type="file" id="fileInput" name="file" />
            <small>Allowed: PDF, Word, Excel, Text, Images (max 50MB)</small>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn primary">Submit Assignment</button>
            <button type="button" class="btn secondary" onclick="closeSubmissionModal()">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script>
      requireAuth();
    </script>
    <script src="js/navigation.js"></script>
    <script src="js/student-assessment.js"></script>
  </body>
</html>
