<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Course Info</title>
    <link rel="icon" type="image/png" href="images/logo.png" />
    <link rel="stylesheet" href="css/general-student.css" />
    <link rel="stylesheet" href="css/course-info-styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="images/logo.png" width="50" />
        <div>
          <h1>Student Dashboard</h1>
          <p class="muted">Courses • Progress • Calendar</p>
        </div>
      </div>
      <nav class="student-nav">
        <a class="dashboard" href="dashboard.html">Dashboard</a>
        <a href="#" id="logoutBtn">Logout</a>
      </nav>
    </header>

    <div class="page">
      <h2 id="courseTitle">Loading…</h2>
      <h3 id="courseInstructor"></h3>
      <h3 id="courseTerm"></h3>

      <div class="panel">
        <h3>My Progress</h3>
        <div class="progress-row">
          <span class="progress-label">Current Average</span>
          <span class="progress-pct" id="courseAverage">—</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill" id="courseAverageBar" style="width: 0%"></div>
        </div>
        <div class="bar-sub" id="pendingCount"></div>
        <div class="btn-row">
          <a class="btn primary" id="gradesLink" href="grades.html">View Grades</a>
          <a class="btn" id="assessmentsLink" href="student-assessment.html">View Assessments</a>
        </div>
      </div>

      <div class="panel">
        <h3>Course Description</h3>
        <p id="courseDescription">No description available.</p>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script>requireAuth();</script>
    <script src="js/navigation.js"></script>
    <script src="js/course-info.js"></script>
  </body>
</html>
