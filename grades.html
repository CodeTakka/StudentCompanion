<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Grades</title>
    <link rel="icon" type="image/png" href="images/logo.png" />
    <link rel="stylesheet" href="css/general-student.css" />
    <link rel="stylesheet" href="css/student-assessment.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="images/logo.png" width="50" />
        <div>
          <h1>My Grades</h1>
          <p class="muted">Academic Performance • Course Totals</p>
        </div>
      </div>
      <nav class="student-nav">
        <a class="dashboard" href="dashboard.html">Dashboard</a>
        <a class="dashboard active" href="grades.html">Grades</a>
        <a class="dashboard" href="student-assessment.html">Assessments</a>
        <a href="#" id="logoutBtn">Logout</a>
      </nav>
    </header>

    <div class="page">
      <h2>Grade Summary</h2>

      <div class="panel" style="margin-bottom: 20px">
        <label for="courseSelect"><strong>View Grades For:</strong></label>
        <select
          id="courseSelect"
          style="margin-left: 10px; padding: 8px; border-radius: 5px"
        >
          <option value="">— Select a Course —</option>
        </select>
      </div>

      <div class="panel" id="gradesPanel">
        <table class="assess-table">
          <thead>
            <tr>
              <th>Assessment</th>
              <th>Score</th>
              <th>Weight</th>
              <th>Weighted Grade</th>
            </tr>
          </thead>
          <tbody id="gradesTableBody">
            <tr>
              <td colspan="4" style="text-align: center; color: #888">
                Please select a course to view your progress.
              </td>
            </tr>
          </tbody>
        </table>

        <div
          class="panel"
          style="margin-top: 20px; background: #f9f9f9; text-align: right"
        >
          <span style="font-size: 1.1em; font-weight: bold"
            >Current Course Average:
          </span>
          <span
            id="courseAverage"
            style="font-size: 1.5em; color: #2c3e50; margin-left: 10px"
            >—</span
          >
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script>
      requireAuth();
    </script>
    <script src="js/navigation.js"></script>
    <script src="js/student-grades.js"></script>
  </body>
</html>
