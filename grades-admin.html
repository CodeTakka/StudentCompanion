<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Manage Grades</title>
    <link rel="icon" type="image/png" href="images/logo.png" />
    <link rel="stylesheet" href="css/grades-admin-styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="header-left">
        <img src="images/logo.png" width="50" />
        <div class="header-text">
          <h1>Smart Course Companion</h1>
          <span>Admin Panel</span>
        </div>
      </div>
      <nav class="admin-nav">
        <a href="manage-course.html">Manage Courses</a>
        <a href="grades-admin.html" class="active">Manage Grades</a>
        <a href="assessments-admin.html">Manage Assessments</a>
        <a href="view-statistics.html">View Statistics</a>
      </nav>
      <div class="header-right">
        <a href="home-page.html" class="logout-btn" onclick="clearSession()">Logout</a>
      </div>
    </header>

    <div class="page">
      <h2>Manage Grades</h2>

      <div class="panel" style="margin-bottom:16px">
        <label><strong>Select Course:</strong>
          <select id="courseSelect" style="margin-left:10px;padding:6px">
            <option value="">— choose a course —</option>
          </select>
        </label>
      </div>

      <div class="panel" id="studentPanel" style="display:none;margin-bottom:16px">
        <label><strong>Select Student:</strong>
          <select id="studentSelect" style="margin-left:10px;padding:6px">
            <option value="">— choose a student —</option>
          </select>
        </label>
      </div>

      <div class="panel" id="gradesPanel" style="display:none">
        <table>
          <thead>
            <tr>
              <th>Assessment</th>
              <th>Earned Marks</th>
              <th>Total Marks</th>
              <th>Weight</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="gradesTableBody">
            <tr><td colspan="5" style="text-align:center;color:#888">Select a student above.</td></tr>
          </tbody>
        </table>
        <div class="course-average">
          <span class="avg-label">Course average</span>
          <span class="avg-number" id="courseAverage">—</span>
        </div>
      </div>

      <div class="panel" id="gradeForm" style="display:none">
        <h3>Enter Grade for: <span id="gradeAssessmentName"></span></h3>
        <div class="form-group">
          <label>Earned Marks</label>
          <input type="number" id="gEarned" placeholder="e.g. 87" min="0" />
        </div>
        <div class="form-group">
          <label>Total Marks</label>
          <input type="number" id="gTotal" placeholder="e.g. 100" min="1" />
        </div>
        <div class="btn-row">
          <button class="btn" onclick="hideGradeForm()">Cancel</button>
          <button class="btn primary" onclick="submitGradeForm()">Save Grade</button>
        </div>
        <p id="gradeFormMessage" style="color:#c0392b;margin-top:8px"></p>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script>requireAuth();</script>
    <script src="js/grades-admin.js"></script>
  </body>
</html>
