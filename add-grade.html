<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Add Grade</title>
    <link rel="icon" type="image/png" href="images/logo.png" />
    <link rel="stylesheet" href="css/add-grade-style.css" />
  </head>
  <body>
    <div class="page">
      <h2>Add Grade</h2>

      <div class="panel">
        <div class="form-group">
          <label>Assessment Name</label>
          <input type="text" placeholder="Example : Quiz 1" />
        </div>

        <div class="form-group">
          <label>Grade</label>
          <input type="number" placeholder="Example : 87" />
        </div>

        <div class="form-group">
          <label>Weight (%)</label>
          <input type="number" placeholder="Example : 15" />
        </div>

        <div class="btn-row">
          <a class="btn" href="grades-admin.html">Cancel</a>
          <a class="btn primary" href="grades-admin.html">Add</a>
        </div>
      </div>
    </div>
  </body>
</html>
